name: Dev Execution API Deploy

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup .NET 10
      # --------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --------------------------------------------------
      # Verify .NET Installation
      # --------------------------------------------------
      - name: Verify .NET
        run: |
          dotnet --version
          dotnet --info

      # --------------------------------------------------
      # Restore Dependencies
      # --------------------------------------------------
      - name: Restore Dependencies
        run: dotnet restore HiMapp_Monolithic.csproj

      # --------------------------------------------------
      # Build Project
      # --------------------------------------------------
      - name: Build Project
        run: dotnet build HiMapp_Monolithic.csproj --configuration Release --no-restore

      # --------------------------------------------------
      # Publish Execution API
      # --------------------------------------------------
      - name: Publish Execution API
        run: dotnet publish HiMapp_Monolithic.csproj --configuration Release --output ./publish --no-restore

      # --------------------------------------------------
      # Install SSH Key
      # --------------------------------------------------
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      # --------------------------------------------------
      # Add EC2 to Known Hosts
      # --------------------------------------------------
      - name: Adding Known Hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_DEV_HOST }} >> ~/.ssh/known_hosts

      # --------------------------------------------------
      # Upload Published Files to EC2
      # --------------------------------------------------
      - name: Upload Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_DEV_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "publish/*"
          target: "/home/ec2-user/HiMapp_Execution_API/publish/"

      # --------------------------------------------------
      # Restart Execution API
      # --------------------------------------------------
      - name: Restart Execution API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_DEV_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo systemctl restart HiMappExecutionAPI.service
            sudo systemctl status HiMappExecutionAPI.service --no-pager
